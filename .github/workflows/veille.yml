
name: Veille PFE 2027

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: write

jobs:
  recherche-stages:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rechercher les offres PFE
        run: python scripts/sync.py

      - name: Enregistrer les nouvelles offres
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/opportunities.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualisation des offres PFE"
            git push
          fi
          
