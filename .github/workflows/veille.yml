
name: Veille PFE 2027

on:
  schedule:
    - cron: "0 7 * * *"
      timezone: "Africa/Casablanca"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recherche-stages:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Rechercher les offres PFE
        env:
          FRANCE_TRAVAIL_CLIENT_ID: ${{ secrets.FRANCE_TRAVAIL_CLIENT_ID }}
          FRANCE_TRAVAIL_CLIENT_SECRET: ${{ secrets.FRANCE_TRAVAIL_CLIENT_SECRET }}
        run: python scripts/sync.py

      - name: Enregistrer les nouvelles offres
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/opportunities.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualisation automatique des offres PFE"
            git push
          fi
